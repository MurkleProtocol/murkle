# /etc/systemd/journald.conf.d/murkle.conf: the services log to the journal (no log files).
# The indexer and relayer never log IP addresses, tickets or keys; the journal still holds
# operational detail, so it is kept bounded and for a limited time.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=10G
SystemMaxFileSize=128M
MaxRetentionSec=30day
MaxFileSec=1week
RateLimitIntervalSec=30s
RateLimitBurst=10000
