# nginx in front of a Murkle node (/etc/nginx/sites-available/murkle.conf), certificates from
# certbot: certbot certonly --webroot -w /var/www/certbot -d murkle.example.org
# Replace murkle.example.org with your domain. Needs nginx 1.25.1 or later ("http2 on").
#   everything -> the indexer (:8787)
# Set MURKLE_TRUST_PROXY=1 only behind this proxy.
# Privacy: access_log off. The server sends its own CSP and security headers.

server {
	listen 80;
	listen [::]:80;
	server_name murkle.example.org;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name murkle.example.org;

	ssl_certificate /etc/letsencrypt/live/murkle.example.org/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/murkle.example.org/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:murkle:10m;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=31536000" always;
	server_tokens off;
	access_log off;
	error_log /var/log/nginx/murkle-error.log warn;

	client_max_body_size 1m;

	# Overwrite, never append: the relayer rate-limits by this address.
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;

	location / {
		proxy_pass http://127.0.0.1:8787;
	}
}
